# 1. https://github.com/actions
# 2. https://github.com/features/actions
# 3. https://docs.github.com/en/actions

---
name: Lint

'on':
  pull_request:       # Allow automatic triggering for PRs.
    branches:
      - 'bugfix/**'
      - 'feature/**'
    types:
      - opened
      - closed
      - labeled
  push:
    branches: [develop, main]
  workflow_dispatch:  # Allow manual triggering.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        # Pinned v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Swift environment
        run: |
          sudo apt-get update
          sudo apt-get install -y swift
      - name: Set up Python environment
        run: |
          python3 -m venv ~/.venv
          source ~/.venv/bin/activate
      - name: Install Pre-Commit
        run: |
          pip install pre-commit==4.7.0 yamllint==1.38.0
      - name: Run Pre-Commit hooks
        env:
          # The local commit guard does not apply to CI checkouts.
          SKIP: no-commit-to-branch
        run: |
          pre-commit run --all-files --show-diff-on-failure
